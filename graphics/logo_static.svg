<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- 1. Wielopasmowy gradient lewego filaru (szczotkowane złoto) -->
    <linearGradient id="ambifyGoldLeft" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#E5AE32"/>
      <stop offset="14%" stop-color="#CA921E"/>
      <stop offset="28%" stop-color="#E2A629"/>
      <stop offset="42%" stop-color="#A8730D"/>
      <stop offset="56%" stop-color="#DF9F1D"/>
      <stop offset="70%" stop-color="#B88014"/>
      <stop offset="84%" stop-color="#9C6406"/>
      <stop offset="100%" stop-color="#6F4202"/>
    </linearGradient>

    <!-- 2. Wielopasmowy gradient prawego filaru -->
    <linearGradient id="ambifyGoldRight" x1="85%" y1="0%" x2="15%" y2="100%">
      <stop offset="0%" stop-color="#DCA226"/>
      <stop offset="16%" stop-color="#B67E14"/>
      <stop offset="32%" stop-color="#D69719"/>
      <stop offset="48%" stop-color="#8F5D0A"/>
      <stop offset="64%" stop-color="#C98A17"/>
      <stop offset="80%" stop-color="#9C6406"/>
      <stop offset="100%" stop-color="#5E3802"/>
    </linearGradient>

    <!-- 3. Fazowanie krawędzi (złoty szlif) -->
    <linearGradient id="bevelAmbify" x1="0%" y1="0%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#FFD66B" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#D4991E" stop-opacity="0.65"/>
      <stop offset="70%" stop-color="#7A4B06" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E8B038" stop-opacity="0.80"/>
    </linearGradient>

    <!-- 4. Szkarłatny rdzeń -->
    <linearGradient id="redGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FF2E38"/>
      <stop offset="55%" stop-color="#E60A15"/>
      <stop offset="100%" stop-color="#9E0008"/>
    </linearGradient>
  </defs>

  <!-- ============================================== -->
  <!-- 1. LEWY FILAR                                 -->
  <!-- ============================================== -->
  <g id="left-pillar">
    <path d="M 300 85 
             L 357 202 
             L 198 480 
             L 110 480 Z" 
          fill="url(#ambifyGoldLeft)"/>

    <path d="M 300 85 L 357 202 L 198 480 L 110 480 Z" 
          fill="none" 
          stroke="url(#bevelAmbify)" 
          stroke-width="1.8" 
          stroke-linejoin="round"/>
  </g>

  <!-- ============================================== -->
  <!-- 2. PRAWY FILAR                                -->
  <!-- ============================================== -->
  <g id="right-pillar">
    <path d="M 319 335 
             L 374 239 
             L 490 480 
             L 402 480 Z" 
          fill="url(#ambifyGoldRight)"/>

    <path d="M 319 335 L 374 239 L 490 480 L 402 480 Z" 
          fill="none" 
          stroke="url(#bevelAmbify)" 
          stroke-width="1.8" 
          stroke-linejoin="round"/>
  </g>

  <!-- ============================================== -->
  <!-- 3. SZKARŁATNY RDZEŃ                           -->
  <!-- ============================================== -->
  <g id="central-core">
    <polygon points="300,368 364,480 236,480" 
             fill="url(#redGrad)"/>

    <polygon points="300,368 364,480 236,480" 
             fill="none" 
             stroke="#FF8086" 
             stroke-width="1.2" 
             opacity="0.85"/>
  </g>
</svg>
