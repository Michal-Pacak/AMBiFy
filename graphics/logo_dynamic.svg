<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- 1. Złocista poświata emitowana przez filary -->
    <filter id="goldLustreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#FFB703" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.80"/>
    </filter>

    <!-- 2. Bogaty, świetlisty gradient złota (lewy filar) -->
    <linearGradient id="ambifyGoldLeft" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A5"/>
      <stop offset="14%" stop-color="#F5C039"/>
      <stop offset="28%" stop-color="#E29E1B"/>
      <stop offset="44%" stop-color="#FFF3B8"/>
      <stop offset="58%" stop-color="#D99113"/>
      <stop offset="74%" stop-color="#F2BA32"/>
      <stop offset="88%" stop-color="#B36F08"/>
      <stop offset="100%" stop-color="#734102"/>
    </linearGradient>

    <!-- 3. Bogaty, świetlisty gradient złota (prawy filar) -->
    <linearGradient id="ambifyGoldRight" x1="85%" y1="0%" x2="15%" y2="100%">
      <stop offset="0%" stop-color="#FFEDA0"/>
      <stop offset="18%" stop-color="#E8AE29"/>
      <stop offset="36%" stop-color="#BD760C"/>
      <stop offset="54%" stop-color="#FFEFA8"/>
      <stop offset="70%" stop-color="#D48B12"/>
      <stop offset="86%" stop-color="#A65F05"/>
      <stop offset="100%" stop-color="#663601"/>
    </linearGradient>

    <!-- 4. Lśniące fazowanie krawędzi -->
    <linearGradient id="bevelAmbify" x1="0%" y1="0%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FFD66B" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#B87D14" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFF0A8" stop-opacity="0.90"/>
    </linearGradient>

    <!-- 5. Szkarłatny rdzeń -->
    <linearGradient id="redGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FF3843"/>
      <stop offset="55%" stop-color="#E60A15"/>
      <stop offset="100%" stop-color="#9E0008"/>
    </linearGradient>

    <style>
      /* 1. CZERWONY TRÓJKĄT: Pojawia się pierwszy, emituje światło, znika OSTATNI */
      @keyframes coreCycle {
        0% {
          transform: scale(0);
          opacity: 0;
          filter: drop-shadow(0 0 0px transparent);
        }
        2% {
          opacity: 1;
        }
        18% {
          transform: scale(1);
          opacity: 1;
          filter: drop-shadow(0 0 8px rgba(255, 26, 36, 0.5));
        }

        /* Pulsowanie z głęboką emanacją szkarłatu */
        27% {
          transform: scale(1.06);
          filter: drop-shadow(0 0 26px rgba(255, 30, 40, 0.95)) drop-shadow(0 0 8px rgba(255, 120, 120, 0.8));
        }
        36% {
          transform: scale(1);
          filter: drop-shadow(0 0 8px rgba(255, 26, 36, 0.5));
        }
        45% {
          transform: scale(1.06);
          filter: drop-shadow(0 0 26px rgba(255, 30, 40, 0.95)) drop-shadow(0 0 8px rgba(255, 120, 120, 0.8));
        }
        54% {
          transform: scale(1);
          filter: drop-shadow(0 0 8px rgba(255, 26, 36, 0.5));
        }
        63% {
          transform: scale(1.06);
          filter: drop-shadow(0 0 26px rgba(255, 30, 40, 0.95)) drop-shadow(0 0 8px rgba(255, 120, 120, 0.8));
        }
        72% {
          transform: scale(1);
          filter: drop-shadow(0 0 8px rgba(255, 26, 36, 0.5));
        }

        /* Filary znikają, trójkąt rozbłyska sam w centrum */
        82% {
          transform: scale(1.05);
          filter: drop-shadow(0 0 22px rgba(255, 30, 40, 0.9));
          opacity: 1;
        }

        /* Trójkąt zwija się do centrum jako ostatni */
        84% {
          transform: scale(1);
          opacity: 1;
        }
        94% {
          transform: scale(0);
          opacity: 0;
          filter: drop-shadow(0 0 0px transparent);
        }
        100% {
          transform: scale(0);
          opacity: 0;
        }
      }

      /* 2. LEWY FILAR: Wzrost od dołu w górę */
      @keyframes leftGrow {
        0%, 18% {
          clip-path: inset(100% 0 0 0);
          opacity: 0;
        }
        19% {
          opacity: 1;
        }
        40% {
          clip-path: inset(0% 0 0 0);
          opacity: 1;
        }
        70%, 100% {
          clip-path: inset(0% 0 0 0);
          opacity: 1;
        }
      }

      /* 3. PRAWY FILAR: Schodzenie od góry w dół */
      @keyframes rightGrow {
        0%, 36% {
          clip-path: inset(0 0 100% 0);
          opacity: 0;
        }
        37% {
          opacity: 1;
        }
        58% {
          clip-path: inset(0 0 0% 0);
          opacity: 1;
        }
        70%, 100% {
          clip-path: inset(0 0 0% 0);
          opacity: 1;
        }
      }

      /* 4. PRZYGNIECENIE FILARÓW OD GÓRY W DÓŁ */
      @keyframes pillarsCrushDown {
        0%, 70% {
          clip-path: inset(0% 0 0% 0);
          transform: translateY(0px);
          opacity: 1;
        }
        82% {
          clip-path: inset(100% 0 0% 0);
          transform: translateY(8px);
          opacity: 0.85;
        }
        83%, 100% {
          clip-path: inset(100% 0 0% 0);
          opacity: 0;
        }
      }

      .anim-core {
        transform-origin: 300px 449px;
        animation: coreCycle 5.2s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }

      .anim-pillars-container {
        animation: pillarsCrushDown 5.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .anim-pillar-left {
        animation: leftGrow 5.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .anim-pillar-right {
        animation: rightGrow 5.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
    </style>
  </defs>

  <!-- ============================================================ -->
  <!-- GRUPA FILARÓW: CIEPŁE, ŚWIETLISTE ZŁOTO Z AURA               -->
  <!-- ============================================================ -->
  <g class="anim-pillars-container" filter="url(#goldLustreGlow)">
    
    <!-- 1. LEWY FILAR (Wzrost od dołu do góry) -->
    <g class="anim-pillar-left">
      <path d="M 300 152.2 
               L 357 249.3 
               L 198 480 
               L 110 480 Z" 
            fill="url(#ambifyGoldLeft)"/>

      <path d="M 300 152.2 L 357 249.3 L 198 480 L 110 480 Z" 
            fill="none" 
            stroke="url(#bevelAmbify)" 
            stroke-width="1.8" 
            stroke-linejoin="round"/>
    </g>

    <!-- 2. PRAWY FILAR (Schodzenie od góry do dołu) -->
    <g class="anim-pillar-right">
      <path d="M 319 359.6 
               L 374 280 
               L 490 480 
               L 402 480 Z" 
            fill="url(#ambifyGoldRight)"/>

      <path d="M 319 359.6 L 374 280 L 490 480 L 402 480 Z" 
            fill="none" 
            stroke="url(#bevelAmbify)" 
            stroke-width="1.8" 
            stroke-linejoin="round"/>
    </g>

  </g>

  <!-- ============================================================ -->
  <!-- SZKARŁATNY RDZEŃ: EMANUJE ŚWIATŁEM I ZNIKA OSTATNI          -->
  <!-- ============================================================ -->
  <g class="anim-core">
    <polygon points="300,387 364,480 236,480" 
             fill="url(#redGrad)"/>
    
    <polygon points="300,387 364,480 236,480" 
             fill="none" 
             stroke="#FFA3A8" 
             stroke-width="1.2" 
             opacity="0.9"/>
  </g>

</svg>
