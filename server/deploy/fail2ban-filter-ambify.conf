# Lines of /var/log/nginx/ambify-public.access.log (nginx "combined" format) that count as a failure:
# a wrong sign-in (401), a wrong password reset code (400), or any request cut by the rate limit (429).
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "POST /auth/login[^"]*" 401\s
            ^<HOST> \S+ \S+ \[[^\]]+\] "POST /auth/reset-password[^"]*" 400\s
            ^<HOST> \S+ \S+ \[[^\]]+\] "[A-Z]+ [^"]*" 429\s
ignoreregex =
