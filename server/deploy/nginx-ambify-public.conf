# AMBiFy from outside home, part 2 (port 443, HTTPS). Needs the Let's Encrypt certificate first.
# Installed as /etc/nginx/sites-available/ambify-public.

# Limits per IP address: sign-in and password reset 10 per minute, the rest of the API 20 per second.
limit_req_zone $binary_remote_addr zone=ambify_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ambify_api:10m rate=20r/s;
limit_req_status 429;

# Anything on 443 that is not ambify.pacak.waw.pl (e.g. a scanner using the bare IP) gets no answer.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ambify.pacak.waw.pl;

    ssl_certificate     /etc/letsencrypt/live/ambify.pacak.waw.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ambify.pacak.waw.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ambify_ssl:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    server_tokens off;

    client_max_body_size 20m;

    # Separate log, read by fail2ban (/etc/fail2ban/jail.d/ambify.conf).
    access_log /var/log/nginx/ambify-public.access.log;

    # X-AMBiFy-Public: the server shows less (e.g. no disk/NAS/backup details in /diagnostics) to the outside.
    location /auth/ {
        limit_req zone=ambify_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/ambify-proxy.conf;
        proxy_set_header X-AMBiFy-Public 1;
    }

    location / {
        limit_req zone=ambify_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/ambify-proxy.conf;
        proxy_set_header X-AMBiFy-Public 1;
    }
}
