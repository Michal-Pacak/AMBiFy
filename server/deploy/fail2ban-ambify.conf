# fail2ban for AMBiFy from outside. Installed as /etc/fail2ban/jail.d/ambify.conf
# together with fail2ban-filter-ambify.conf as /etc/fail2ban/filter.d/ambify-auth.conf.
# 10 failed sign-ins (401) or rate-limit hits (429) within 10 minutes = the IP is blocked for 1 hour.
# The home network is never blocked.
[ambify-auth]
enabled  = true
port     = http,https
filter   = ambify-auth
logpath  = /var/log/nginx/ambify-public.access.log
backend  = auto
maxretry = 10
findtime = 10m
bantime  = 1h
ignoreip = 127.0.0.1/8 ::1 192.168.1.0/24
