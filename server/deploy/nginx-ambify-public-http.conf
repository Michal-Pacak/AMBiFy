# AMBiFy from outside home, part 1 (port 80): only Let's Encrypt checks, everything else goes to HTTPS.
# Installed as /etc/nginx/sites-available/ambify-public-http.
# Port 80 is shared with the OpenMediaVault panel: this block answers only for ambify.pacak.waw.pl,
# every other name still goes to the panel, which stays LAN-only (openmediavault-webgui.d/10-lan-only.conf).
server {
    listen 80;
    listen [::]:80;
    server_name ambify.pacak.waw.pl;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
